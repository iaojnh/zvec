name: HNSW Physical Device Tests

# Manual only: attach trusted devices to dedicated runners before dispatching.
# Android runner label: hnsw-android-arm64; tools: adb, NDK, CMake, Ninja, Python.
# iOS runner label: hnsw-ios; tools: Xcode/CoreDevice, CMake, Python, plus an
# installed Apple Development identity and a profile covering the device/app.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Physical device platform
        type: choice
        options: [android-arm64, ios]
        required: true
      device:
        description: adb serial or CoreDevice UDID (unlocked and trusted)
        type: string
        required: true
      ios_team:
        description: Apple development team ID (iOS only)
        type: string
        default: ''
      ios_bundle:
        description: Bundle ID covered by the installed profile (iOS only)
        type: string
        default: com.example.zvec.hnsw-platform-test
      ios_profile:
        description: Installed development provisioning profile name (iOS only)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android-arm64'
    runs-on: [self-hosted, Linux, hnsw-android-arm64]
    timeout-minutes: 60
    env:
      HNSW_DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build self-contained ARM64 HNSW tests
        shell: bash
        run: |
          : "${ANDROID_NDK_HOME:?Set ANDROID_NDK_HOME on the device runner}"
          cmake -S . -B build/hnsw-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_NATIVE_API_LEVEL=29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF \
            -DBUILD_ZVEC_AILEGO_SHARED=OFF -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_C_BINDINGS=OFF -DBUILD_TOOLS=OFF \
            -DENABLE_NATIVE=OFF -DAUTO_DETECT_ARCH=OFF -DENABLE_WERROR=ON
          cmake --build build/hnsw-android --target hnsw_platform_test --parallel
      - name: Run on physical Android ARM64 device
        shell: bash
        run: |
          python3 .github/scripts/hnsw_test_runner.py android \
            --device "$HNSW_DEVICE" \
            --binary build/hnsw-android/bin/hnsw_platform_test
      - name: Save physical-device results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hnsw-android-arm64-device
          path: build/hnsw-device-results
          if-no-files-found: ignore

  ios:
    if: inputs.platform == 'ios'
    runs-on: [self-hosted, macOS, ARM64, hnsw-ios]
    timeout-minutes: 60
    env:
      HNSW_DEVICE: ${{ inputs.device }}
      HNSW_TEAM: ${{ inputs.ios_team }}
      HNSW_BUNDLE: ${{ inputs.ios_bundle }}
      HNSW_PROFILE: ${{ inputs.ios_profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and sign device test app
        shell: bash
        run: |
          : "${HNSW_TEAM:?Supply the development team ID}"
          : "${HNSW_PROFILE:?Supply the installed provisioning profile name}"
          cmake -S . -B build/hnsw-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DIOS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF \
            -DBUILD_ZVEC_AILEGO_SHARED=OFF -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_C_BINDINGS=OFF -DBUILD_TOOLS=OFF -DENABLE_WERROR=ON \
            -DZVEC_HNSW_TEST_BUNDLE_ID="$HNSW_BUNDLE" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$HNSW_TEAM" \
            -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="$HNSW_PROFILE" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="Apple Development"
          cmake --build build/hnsw-ios --target hnsw_platform_test \
            --config Release --parallel "$(sysctl -n hw.ncpu)"
      - name: Run on physical iOS device
        shell: bash
        run: |
          HNSW_APP=$(python3 -c 'from pathlib import Path; apps = list(Path("build/hnsw-ios/bin").rglob("hnsw_platform_test.app")); assert len(apps) == 1, apps; print(apps[0])')
          python3 .github/scripts/hnsw_test_runner.py ios \
            --device "$HNSW_DEVICE" --app "$HNSW_APP"
      - name: Save physical-device results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hnsw-ios-device
          path: build/hnsw-device-results
          if-no-files-found: ignore
