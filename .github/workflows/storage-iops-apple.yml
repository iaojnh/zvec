name: DiskANN Apple Storage IOPS Recovery

on:
  push:
    branches: [codex/test-diskann-platform-metrics]
    paths: ['.github/workflows/storage-iops-apple.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: IOPS (iOS ARM64 simulator on macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.30.0 ninja==1.11.1
      - name: Build standalone simulator probe
        run: |
          cmake -S benchmarks/storage_iops -B build-iops -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-iops --parallel 3
          codesign --force --sign - --timestamp=none build-iops/bin/storage_iops.app
      - name: Boot simulator
        run: |
          device=$(xcrun simctl list devices available -j | python -c '
          import json, sys
          data = json.load(sys.stdin)
          print(next(d["udid"] for runtime, devices in data["devices"].items()
                     if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "IOPS_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Measure iOS simulator IOPS with durable native result files
        run: |
          python scripts/run_storage_iops.py --binary build-iops/bin/storage_iops.app \
            --output iops-results/ios --label ios-arm64-simulator-macos26 \
            --transport ios --device "$IOPS_DEVICE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-iops-ios-recovery
          path: iops-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown simulator
        if: always() && env.IOPS_DEVICE != ''
        run: xcrun simctl shutdown "$IOPS_DEVICE"

  summary:
    if: always()
    needs: ios
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect already completed Linux controls
        uses: actions/download-artifact@v8
        with:
          pattern: storage-iops-linux-*
          run-id: 41965293595
          github-token: ${{ github.token }}
          path: all-iops/controls
      - name: Collect already completed Windows controls
        uses: actions/download-artifact@v8
        with:
          pattern: storage-iops-windows-*
          run-id: 41965293595
          github-token: ${{ github.token }}
          path: all-iops/controls
      - name: Collect verified Android storage-path measurements
        uses: actions/download-artifact@v8
        with:
          name: storage-iops-android-emulator
          run-id: 41965293595
          github-token: ${{ github.token }}
          path: all-iops/android
      - name: Collect completed macOS measurements
        uses: actions/download-artifact@v8
        with:
          pattern: storage-iops-macos-*
          run-id: 41963887587
          github-token: ${{ github.token }}
          path: all-iops/macos
      - uses: actions/download-artifact@v8
        with:
          name: storage-iops-ios-recovery
          path: all-iops/ios
      - name: Summarize measured environments with source metadata
        run: |
          python scripts/run_storage_iops.py --summarize all-iops --output iops-summary
          cat iops-summary/iops.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: storage-iops-complete-summary
          path: iops-summary/
          retention-days: 30
