name: SDE diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install zvec==0.7.0
        shell: powershell
      - name: Download and validate Intel SDE
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP "sde.tar.xz"
          Write-Host "Download started at $(Get-Date -Format o)"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Uri "https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-win.tar.xz" -OutFile $archive
          Write-Host "Download completed at $(Get-Date -Format o)"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "74E626EDE09B0BAA5011FC9E51B58627EA92C3FC0BAE5FD7DB34B490F335F651") { throw "Checksum mismatch" }
          Write-Host "Archive extraction started at $(Get-Date -Format o)"
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Archive extraction finished at $(Get-Date -Format o)"
          $sde = Join-Path $env:RUNNER_TEMP "sde-external-10.13.1-2026-07-28-win\sde.exe"
          Write-Host "Version probe started at $(Get-Date -Format o)"
          & $sde -version
          Write-Host "Version probe finished at $(Get-Date -Format o)"
          Write-Host "Python startup test at $(Get-Date -Format o)"
          & $sde -wsm -chip_check_image python.exe -- python -I -c "print('SDE Python startup OK', flush=True)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = python -c "import importlib.util; print(next(iter(importlib.util.find_spec('zvec').submodule_search_locations)))"
          $images = Get-ChildItem $package -Recurse -File | Where-Object { $_.Extension -eq '.pyd' -or $_.Extension -eq '.dll' }
          $imageArgs = @()
          foreach ($image in $images) { $imageArgs += @('-chip_check_image', $image.Name) }
          Write-Host "Known-broken 0.7.0 DLL negative control at $(Get-Date -Format o)"
          $ErrorActionPreference = 'Continue'
          $output = & $sde -wsm @imageArgs -- python -I .github/workflows/scripts/smoke_no_avx.py --dll-only 2>&1
          $result = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $output | ForEach-Object { Write-Host $_ }
          if ($result -eq 0 -or "$output" -notmatch 'Executed instruction not valid') { throw "Negative control did not detect the known AVX initializer" }
          Write-Host "Negative control correctly rejected AVX initialization"
