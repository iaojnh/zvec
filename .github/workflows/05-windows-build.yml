name: Windows WAL Diagnostics

on:
  push:
    branches: [codex/diagnose-windows-wal]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows build and test matrix
  build-and-test-windows:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            msvc_arch: x64
            python_version: '3.10'

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Show env info
        run: |
          Get-CimInstance -ClassName Win32_Processor
          where cl
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -prerelease -format json
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cleanup left marker files
        run: |
          git submodule foreach --recursive 'git reset --hard && git clean -ffdx'
        shell: powershell

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          # The explicit statistics steps below are best-effort. Do not let
          # the action's post-run statistics fail an otherwise successful job.
          disable_annotations: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up environment variables
        run: |
          $nproc = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          echo "NPROC=$nproc" >> $env:GITHUB_ENV
          echo "Using $nproc parallel jobs for builds"
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip `
            pybind11==3.0 `
            cmake==3.30.0 `
            ninja==1.11.1 `
            pytest `
            pytest-xdist `
            scikit-build-core `
            setuptools_scm
        shell: powershell

      - name: Build from source
        run: |
          cd "$env:GITHUB_WORKSPACE"
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$env:NPROC"
          python -m pip install -v . `
            --no-build-isolation `
            --config-settings='cmake.define.BUILD_TOOLS=OFF' `
            --config-settings='cmake.define.ENABLE_WERROR=ON' `
            --config-settings='cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache' `
            --config-settings='cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache'
        shell: powershell

      - name: Show sccache statistics after pip install
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell

      - name: Run Python Tests
        run: |
          cd "$env:GITHUB_WORKSPACE"
          python -m pytest python/tests/test_readonly_storage.py -k "update and flat and False" -n 4 -v --basetemp=./.pytest_tmp
        shell: powershell

      - name: Preserve failed recovery stores
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-wal-recovery
          path: .pytest_tmp
          include-hidden-files: true
          retention-days: 2
