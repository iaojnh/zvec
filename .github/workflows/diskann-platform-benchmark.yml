name: DiskANN Platform Benchmark

on:
  push:
    branches: [codex/test-diskann-platform-metrics]
    paths:
      - '.github/workflows/diskann-platform-benchmark.yml'
      - 'scripts/*diskann_platform*.py'
      - 'scripts/compare_diskann_query_cache.py'
      - 'scripts/prepare_iops_nvme.ps1'
      - 'tests/core/interface/diskann_platform_benchmark_test.cc'
      - 'tests/core/interface/diskann_benchmark_counters.h'
      - 'tests/core/interface/CMakeLists.txt'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      vectors:
        description: 'SIFT vectors (100000 for first run, up to 1000000)'
        type: string
        default: '100000'

permissions:
  contents: read

concurrency:
  group: diskann-platform-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy h5py
      - name: Prepare shared dataset and exact ground truth
        env:
          VECTOR_COUNT: ${{ inputs.vectors || '100000' }}
          OPENBLAS_NUM_THREADS: '2'
        run: python scripts/prepare_diskann_platform_data.py --output benchmark-data --count "$VECTOR_COUNT"
      - uses: actions/upload-artifact@v7
        with:
          name: diskann-platform-dataset
          path: benchmark-data/
          retention-days: 14

  desktop:
    needs: dataset
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-24.04
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-15
          - label: macos-x86_64
            runner: macos-15-intel
          - label: windows-x86_64
            runner: windows-2025
            msvc: x64
          - label: windows-arm64
            runner: windows-11-arm
            msvc: arm64
    name: Benchmark (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Install build tools
        run: python -m pip install cmake==3.30.0 ninja==1.11.1
      - name: Configure benchmark
        shell: bash
        run: >-
          cmake -S . -B build-benchmark -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TOOLS=OFF -DBUILD_PYTHON_BINDINGS=OFF
          -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF
          -DBUILD_ZVEC_AILEGO_SHARED=OFF -DENABLE_WERROR=ON
      - name: Build benchmark only
        run: cmake --build build-benchmark --target diskann_platform_benchmark_test --parallel 3
      - uses: actions/download-artifact@v8
        with:
          name: diskann-platform-dataset
          path: benchmark-data
      - name: Prepare verified blank local NVMe on Windows ARM64
        if: matrix.label == 'windows-arm64'
        shell: pwsh
        run: ./scripts/prepare_iops_nvme.ps1 -OutputDirectory benchmark-results/nvme-setup
      - name: Measure HNSW and DiskANN in isolated processes
        shell: bash
        env:
          BENCH_LABEL: ${{ matrix.label }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          binary=build-benchmark/bin/diskann_platform_benchmark_test
          if [[ "$RUNNER_OS_NAME" == Windows ]]; then binary="$binary.exe"; fi
          data=benchmark-data
          if [[ -n "${IOPS_NVME_ROOT:-}" ]]; then
            data="$IOPS_NVME_ROOT/query-data"
            python -c 'import shutil,sys; shutil.copytree(sys.argv[1],sys.argv[2],dirs_exist_ok=True)' benchmark-data "$data"
          fi
          python scripts/benchmark_diskann_platform.py \
            --binary "$binary" --data "$data" \
            --output benchmark-results --label "$BENCH_LABEL" --cache-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diskann-platform-${{ matrix.label }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Benchmark (Android x86_64 emulator)
    needs: dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      NDK_VERSION: '26.1.10909125'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install build tools and NDK
        run: |
          python -m pip install cmake==3.30.0 ninja==1.11.1
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-34"
      - name: Build benchmark for Android
        run: |
          cmake -S . -B build-benchmark -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_NATIVE_API_LEVEL=34 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TOOLS=OFF -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF -DBUILD_ZVEC_AILEGO_SHARED=OFF \
            -DENABLE_NATIVE=OFF -DAUTO_DETECT_ARCH=OFF -DENABLE_WERROR=ON
          cmake --build build-benchmark --target diskann_platform_benchmark_test --parallel 3
      - uses: actions/download-artifact@v8
        with:
          name: diskann-platform-dataset
          path: benchmark-data
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run emulator benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: python scripts/benchmark_diskann_platform.py --binary build-benchmark/bin/diskann_platform_benchmark_test --data benchmark-data --output benchmark-results --label android-x86_64-emulator --transport android --cache-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diskann-platform-android-emulator
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  ios:
    name: Benchmark (iOS ARM64 simulator)
    needs: dataset
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.30.0 ninja==1.11.1
      - name: Build benchmark for iOS simulator
        run: |
          cmake -S . -B build-benchmark -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DIOS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TOOLS=OFF -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF -DBUILD_ZVEC_AILEGO_SHARED=OFF \
            -DENABLE_WERROR=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-benchmark --target diskann_platform_benchmark_test --parallel 3
      - uses: actions/download-artifact@v8
        with:
          name: diskann-platform-dataset
          path: benchmark-data
      - name: Boot simulator
        run: |
          device=$(xcrun simctl list devices available -j | python -c '
          import json, sys
          data = json.load(sys.stdin)
          print(next(d["udid"] for runtime, devices in data["devices"].items()
                     if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "BENCH_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Run simulator benchmark
        run: |
          python scripts/benchmark_diskann_platform.py \
            --binary build-benchmark/bin/diskann_platform_benchmark_test.app \
            --data benchmark-data --output benchmark-results --label ios-arm64-simulator \
            --transport ios --device "$BENCH_DEVICE" --cache-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diskann-platform-ios-simulator
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown simulator
        if: always() && env.BENCH_DEVICE != ''
        run: xcrun simctl shutdown "$BENCH_DEVICE"

  summary:
    if: always()
    needs: [dataset, desktop, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: diskann-platform-*
          path: all-results
      - name: Generate publication table and full comparison
        run: |
          python scripts/summarize_diskann_platform.py --input all-results --output benchmark-summary
          cat benchmark-summary/comparison.md >> "$GITHUB_STEP_SUMMARY"
          if test -f benchmark-summary/cache-comparison.md; then
            cat benchmark-summary/cache-comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: diskann-platform-summary
          path: benchmark-summary/
          retention-days: 30
