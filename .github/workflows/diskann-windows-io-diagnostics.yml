name: DiskANN Windows I/O Diagnostics

on:
  push:
    branches: [codex/test-diskann-platform-metrics]
    paths:
      - '.github/workflows/diskann-windows-io-diagnostics.yml'
      - 'scripts/diagnose_windows_disk_io.py'
      - 'scripts/replay_diskann_storage.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Storage (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 control completed in run 41959880409. Focus the storage
          # correction on ARM64, where an unused local NVMe disk is present.
          - label: windows-arm64
            runner: windows-11-arm
            msvc: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: diskann-platform-dataset
          run-id: 41956363918
          github-token: ${{ github.token }}
          path: benchmark-data
      - name: Capture actual CI disks and volumes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-io-diagnostics
          Get-Disk | Select-Object Number,FriendlyName,BusType,Size,LogicalSectorSize,PhysicalSectorSize,PartitionStyle,NumberOfPartitions,IsSystem,IsBoot,IsOffline,IsReadOnly | ConvertTo-Json | Out-File windows-io-diagnostics/disks.json
          Get-PhysicalDisk | Select-Object FriendlyName,MediaType,BusType,Size | ConvertTo-Json | Out-File windows-io-diagnostics/physical-disks.json
          Get-Partition | Select-Object DiskNumber,PartitionNumber,DriveLetter,Size | ConvertTo-Json | Out-File windows-io-diagnostics/partitions.json
          Get-Volume | Select-Object DriveLetter,FileSystemLabel,FileSystem,Size,SizeRemaining | ConvertTo-Json | Out-File windows-io-diagnostics/volumes.json
      - name: Probe buffered versus unbuffered and IOCP reads
        run: python scripts/diagnose_windows_disk_io.py --file benchmark-data/base.fbin --output windows-io-diagnostics/dataset-probe.json
      - name: Prepare only a verified blank GitHub-hosted local NVMe scratch disk
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Scratch initialization is restricted to ephemeral GitHub-hosted VMs.'
          }
          $candidates = @(Get-Disk | Where-Object {
            $_.FriendlyName -eq 'Microsoft NVMe Direct Disk v2' -and
            $_.BusType -eq 'NVMe' -and $_.PartitionStyle -eq 'RAW' -and
            $_.NumberOfPartitions -eq 0 -and -not $_.IsSystem -and -not $_.IsBoot
          })
          if ($candidates.Count -ne 1) {
            Write-Host 'No unique verified blank local NVMe disk; keeping the original volume.'
            exit 0
          }
          $scratchDisk = $candidates[0]
          if (@(Get-Partition -DiskNumber $scratchDisk.Number -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'Scratch candidate has partitions; refusing to initialize it.'
          }
          $scratchDisk | ConvertTo-Json -Depth 3 | Out-File windows-io-diagnostics/scratch-disk-before.json
          if ($scratchDisk.IsOffline) { Set-Disk -Number $scratchDisk.Number -IsOffline $false }
          if ($scratchDisk.IsReadOnly) { Set-Disk -Number $scratchDisk.Number -IsReadOnly $false }
          Initialize-Disk -Number $scratchDisk.Number -PartitionStyle GPT
          $partition = New-Partition -DiskNumber $scratchDisk.Number -UseMaximumSize -AssignDriveLetter
          $partition | Format-Volume -FileSystem NTFS -NewFileSystemLabel ZvecCIScratch -Confirm:$false
          $scratchRoot = "$($partition.DriveLetter):\zvec-io-scratch"
          New-Item -ItemType Directory -Force $scratchRoot
          Copy-Item benchmark-data/* $scratchRoot -Recurse -Force
          "BENCH_NVME_ROOT=$scratchRoot" >> $env:GITHUB_ENV
          Get-Partition -DiskNumber $scratchDisk.Number | ConvertTo-Json -Depth 3 | Out-File windows-io-diagnostics/scratch-partition.json
      - name: Probe the same data on local NVMe before rebuilding indexes
        if: env.BENCH_NVME_ROOT != ''
        shell: pwsh
        run: python scripts/diagnose_windows_disk_io.py --file "$env:BENCH_NVME_ROOT/base.fbin" --output windows-io-diagnostics/nvme-dataset-probe.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diskann-windows-storage-initial-${{ matrix.label }}
          path: windows-io-diagnostics/
          retention-days: 30
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - run: python -m pip install cmake==3.30.0 ninja==1.11.1
      - name: Build native benchmark
        shell: bash
        run: |
          cmake -S . -B build-diagnostics -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TOOLS=OFF -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_ZVEC_SHARED=OFF -DBUILD_ZVEC_CORE_SHARED=OFF -DBUILD_ZVEC_AILEGO_SHARED=OFF \
            -DENABLE_WERROR=ON
          cmake --build build-diagnostics --target diskann_platform_benchmark_test --parallel 3
      - name: Re-run native HNSW and DiskANN on this same CI host
        env:
          BENCH_LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          python scripts/benchmark_diskann_platform.py \
            --binary build-diagnostics/bin/diskann_platform_benchmark_test.exe \
            --data benchmark-data --output windows-io-diagnostics/baseline --label "$BENCH_LABEL"
      - name: Probe the actual trained DiskANN index
        run: python scripts/diagnose_windows_disk_io.py --file benchmark-data/diskann.index --output windows-io-diagnostics/index-probe.json
      - name: Replay identical trained indexes on local NVMe
        if: env.BENCH_NVME_ROOT != ''
        shell: pwsh
        env:
          BENCH_LABEL: ${{ matrix.label }}
        run: |
          python scripts/replay_diskann_storage.py --binary build-diagnostics/bin/diskann_platform_benchmark_test.exe --source benchmark-data --target "$env:BENCH_NVME_ROOT" --baseline windows-io-diagnostics/baseline/result.json --output windows-io-diagnostics/nvme --label "${env:BENCH_LABEL}-local-nvme"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/diagnose_windows_disk_io.py --file "$env:BENCH_NVME_ROOT/diskann.index" --output windows-io-diagnostics/nvme-index-probe.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diskann-windows-storage-complete-${{ matrix.label }}
          path: windows-io-diagnostics/
          retention-days: 30
