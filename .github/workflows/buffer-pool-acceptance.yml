name: Buffer Pool Acceptance

on:
  push:
    branches: [test/buffer-pool-acceptance]

permissions:
  contents: read

concurrency:
  group: buffer-pool-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  desktop:
    name: Desktop compatibility (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-arm64, os: ubuntu-24.04-arm}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x64, os: macos-15-intel}
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      buffer_pool_acceptance: true

  windows:
    name: Windows x64 and ARM64 compatibility
    uses: ./.github/workflows/05-windows-build.yml
    with:
      buffer_pool_acceptance: true

  android:
    name: Android emulator and device ABI compatibility
    uses: ./.github/workflows/04-android-build.yml

  ios:
    name: iOS simulator and device SDK compatibility
    uses: ./.github/workflows/06-ios-build.yml

  musllinux:
    name: Linux musl compatibility
    uses: ./.github/workflows/09-musllinux-build.yml

  build:
    name: Build Linux x64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: buffer-pool-acceptance-linux-x64
          max-size: 1G
      - name: Build wheel and native test executables
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(python - <<'PY'
          import os
          from pathlib import Path
          memory = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          available_kib = int(memory["MemAvailable"].split()[0])
          print(max(1, min(4, os.cpu_count() or 1, available_kib // (2 * 1024**2))))
          PY
          )
          python -m pip install pybind11==3.0 cmake==3.30.0 ninja==1.11.1 \
            scikit-build-core setuptools_scm
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir candidate \
            -C cmake.define.AUTO_DETECT_ARCH=OFF \
            -C cmake.define.BUILD_C_BINDINGS=ON \
            -C cmake.define.BUILD_ZVEC_SHARED=OFF \
            -C cmake.define.BUILD_ZVEC_AILEGO_SHARED=OFF \
            -C cmake.define.BUILD_ZVEC_CORE_SHARED=OFF \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
          read -r -a targets <<< "$(python .github/scripts/buffer_pool_backend_tests.py --print-targets)"
          # These targets are bundled and executed below. Desktop compatibility
          # jobs separately compile the full native test suite.
          cmake --build build --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" --target "${targets[@]}"
          python .github/scripts/buffer_pool_native_bundle.py build candidate/native-tests.tar.gz "${targets[@]}"
          git rev-parse HEAD > candidate/commit.txt
          git submodule status --recursive > candidate/submodules.txt
          printf '%s\n' "$CMAKE_BUILD_PARALLEL_LEVEL" > candidate/compiler-parallelism.txt
          grep -E '^(AUTO_DETECT_ARCH|BUILD_.*SHARED|CMAKE_(BUILD_TYPE|CXX_COMPILER|CXX_FLAGS|GENERATOR)):' build/CMakeCache.txt > candidate/build-config.txt
          (cd candidate && sha256sum ./*.whl ./native-tests.tar.gz > SHA256SUMS)
      - name: Verify portable distance kernels
        run: |
          python -m pip install candidate/*.whl
          python .github/scripts/buffer_pool_distance_sanity.py
      - name: Verify shutdown persistence without reopening readers
        run: |
          cmake --build build --parallel 2 --target segment_test
          ./build/bin/segment_test --gtest_color=no \
            --gtest_filter='*FlushForClosePersistsVectorsAndForwardRows*' \
            --gtest_output=xml:candidate/close-persistence.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tests = list(ET.parse("candidate/close-persistence.xml").iter("testcase"))
          assert tests and any(t.find("skipped") is None for t in tests)
          assert not any(t.find("failure") is not None or t.find("error") is not None for t in tests)
          PY
          (cd candidate && sha256sum close-persistence.xml >> SHA256SUMS)
      - uses: ./.github/actions/upload-evidence
        with:
          name: buffer-pool-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 14

  build-memory:
    name: Index build memory control (${{ matrix.index }}, 512 MiB)
    needs: build
    runs-on: ubuntu-24.04
    # The 400K x 768 DiskANN graph also runs on ordinary shared CI CPUs.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: ivf, native_filter: '*/Ivf*'}
          - {index: diskann, native_filter: '*/Diskann*'}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify build admission and retry after rejection
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/candidate/lib
          NATIVE_FILTER: ${{ matrix.native_filter }}
        run: |
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          python -m pip install candidate/*.whl
          tar -xzf candidate/native-tests.tar.gz -C candidate
          candidate/bin/index_build_admission_test --gtest_color=no \
            --gtest_filter="$NATIVE_FILTER" --gtest_output=xml:evidence/native.xml
      - name: Build a larger-than-budget corpus without swap
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -o pipefail
          python_path=$(command -v python)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="index-build-${{ matrix.index }}-${{ github.run_id }}" \
            --property=MemoryMax=768M --property=MemorySwapMax=0 \
            --property=LimitNOFILE=65536 \
            --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
            --setenv=OPENBLAS_NUM_THREADS=1 --setenv=OMP_NUM_THREADS=1 \
            "$python_path" .github/scripts/buffer_pool_system_limit.py 805306368 evidence/cgroup.jsonl \
            "$python_path" -X faulthandler .github/scripts/buffer_pool_build_memory.py \
            "$INDEX" "$RUNNER_TEMP/build-memory-collection" evidence/build.jsonl \
            2>&1 | tee evidence/build.log
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-build-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Acceptance (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: budget
            native: process_rss_budget_test pool_admission_test result_memory_allowance_test retained_block_allocator_test budgeted_mapped_buffer_test eviction_queue_budget_test slab_backing_budget_test budgeted_aligned_buffer_test vector_page_table_test vector_page_table_bypass_aio_test
          - shard: storage
            native: buffer_read_storage_test buffer_storage_write_test
          - shard: ivf
            native: ivf_workspace_budget_test
          - shard: diskann
            native: diskann_file_reader_aio_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify candidate provenance
        run: |
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          cp candidate/commit.txt candidate/SHA256SUMS evidence/
          tar -xzf candidate/native-tests.tar.gz -C candidate
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/candidate/lib" >> "$GITHUB_ENV"
      - name: Install Linux asynchronous I/O runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libaio1t64 liburing2
      - name: Run native tests
        env:
          NATIVE_TESTS: ${{ matrix.native }}
        run: |
          set -o pipefail
          read -r -a targets <<< "$NATIVE_TESTS"
          for target in "${targets[@]}"; do
            mkdir -p "$RUNNER_TEMP/$target"
            (cd "$RUNNER_TEMP/$target" && "$GITHUB_WORKSPACE/candidate/bin/$target" \
              --gtest_color=no --gtest_output="xml:$GITHUB_WORKSPACE/evidence/$target.xml") \
              2>&1 | tee "evidence/$target.log"
          done
      - name: Repeat storage reopen and retry in one process
        if: matrix.shard == 'storage'
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/buffer_storage_write_test"
          "$GITHUB_WORKSPACE/candidate/bin/buffer_storage_write_test" --gtest_color=no \
            --gtest_filter='*WritableReopenWithoutCreationPersistsChanges:*WritableReopenNeedsCacheAndAllowsRetry:*WriteBatchReportsBudgetDenialAndCanRetry:*MutableBatchSnapshotsSurviveOverwriteAndClose' \
            --gtest_repeat=36 2>&1 | tee "$GITHUB_WORKSPACE/evidence/storage-reopen.log"
          test "$(grep -Fc '[  PASSED  ] 4 tests.' "$GITHUB_WORKSPACE/evidence/storage-reopen.log")" -eq 36
      - uses: actions/setup-python@v7
        if: matrix.shard != 'storage'
        with:
          python-version: '3.10'
      - name: Install candidate wheel
        if: matrix.shard != 'storage'
        run: python -m pip install candidate/*.whl pytest pytest-xdist
      - name: Exercise public API memory denial and recovery
        if: matrix.shard == 'budget'
        run: |
          python -m pytest -n 0 .github/scripts/test_buffer_pool_ci.py .github/scripts/test_buffer_pool_ci_tools.py --junitxml=evidence/acceptance-gates.xml
          python -m pytest -n 0 python/tests/test_fetch_result_budget.py \
            -k 'large_vector_result_admission_and_recovery or large_query_result_copy_admission_and_recovery or retained_vectors_reject_growth_and_release_for_retry' \
            --junitxml=evidence/public-budget.xml
      - name: Run public lifecycle and measure RSS
        if: matrix.shard == 'ivf' || matrix.shard == 'diskann'
        env:
          INDEX: ${{ matrix.shard }}
        run: |
          set -o pipefail
          python -X faulthandler .github/scripts/buffer_pool_acceptance.py "$INDEX" \
            "$RUNNER_TEMP/collection" "evidence/$INDEX-rss.jsonl" \
            2>&1 | tee "evidence/$INDEX.log"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-${{ matrix.shard }}
          path: evidence/
          retention-days: 14

  io-backends:
    name: Linux x64 shared paths (${{ matrix.backend }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [io_uring, libaio, pread]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify and install the exact candidate
        run: |
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          tar -xzf candidate/native-tests.tar.gz -C candidate
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/candidate/lib" >> "$GITHUB_ENV"
          python -m pip install candidate/*.whl pytest pytest-xdist
      - uses: ./.github/actions/buffer-pool-backend
        with:
          backend: ${{ matrix.backend }}
          platform: linux-x64
          native-bin: ${{ github.workspace }}/candidate/bin

  public-suite:
    name: Public API mutations, FTS, quantizers and recovery
    needs: [build, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify and install candidate
        run: |
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          python -m pip install candidate/*.whl pytest pytest-xdist
      - name: Run public interface contracts
        run: |
          mkdir -p evidence
          python -m pytest -n 0 \
            python/tests/test_readonly_storage.py \
            python/tests/test_quantized_collection_mutations.py \
            python/tests/test_collection_fts.py \
            python/tests/test_collection_fts_vector_hybrid.py \
            python/tests/test_arrow_executor_budget.py \
            python/tests/test_ddl_input_budget.py \
            python/tests/test_query_input_budget.py \
            python/tests/test_write_input_budget.py \
            python/tests/test_scan_input_budget.py \
            python/tests/test_sequence_input_budget.py \
            python/tests/test_fetch_result_budget.py \
            --junitxml=evidence/public.xml
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-public-suite
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  baseline-build:
    name: Build pinned pre-change baseline
    needs: public-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned baseline
        id: baseline
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path(".github/scripts/buffer_pool_policy.json").read_text())
          print("commit=" + policy["baseline_commit"])
          PY
      - uses: actions/checkout@v7
        with:
          repository: iaojnh/zvec
          ref: ${{ steps.baseline.outputs.commit }}
          path: baseline-source
          submodules: recursive
          persist-credentials: false
      - name: Apply baseline runtime-kernel build compatibility
        run: |
          # The pinned source disables per-kernel ISA flags with a portable
          # package baseline, producing no-op AVX kernels. Apply only those
          # two CMake guards; preserve algorithms and record the exact patch.
          patch="$GITHUB_WORKSPACE/.github/patches/baseline-portable-x86-kernels.patch"
          git -C baseline-source apply --check "$patch"
          git -C baseline-source apply "$patch"
          mkdir -p baseline
          cp "$patch" baseline/build-compatibility.patch
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: buffer-pool-baseline-linux-x64
          max-size: 1G
      - name: Build baseline with the same toolchain and flags
        working-directory: baseline-source
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python -m pip install pybind11==3.0 cmake==3.30.0 ninja==1.11.1 scikit-build-core setuptools_scm
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir ../baseline \
            -C cmake.define.AUTO_DETECT_ARCH=OFF -C cmake.define.BUILD_C_BINDINGS=ON \
            -C cmake.define.BUILD_ZVEC_SHARED=OFF -C cmake.define.BUILD_ZVEC_AILEGO_SHARED=OFF \
            -C cmake.define.BUILD_ZVEC_CORE_SHARED=OFF \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
          git rev-parse HEAD > ../baseline/commit.txt
          git submodule status --recursive > ../baseline/submodules.txt
          grep -E '^(AUTO_DETECT_ARCH|BUILD_.*SHARED|CMAKE_(BUILD_TYPE|CXX_COMPILER|CXX_FLAGS|GENERATOR)):' build/CMakeCache.txt > ../baseline/build-config.txt
          (cd ../baseline && sha256sum ./*.whl ./build-compatibility.patch > SHA256SUMS)
      - name: Verify baseline distance kernels
        run: |
          python -m pip install baseline/*.whl
          python .github/scripts/buffer_pool_distance_sanity.py
      - uses: ./.github/actions/upload-evidence
        with:
          name: buffer-pool-baseline
          path: baseline/
          if-no-files-found: error
          retention-days: 14

  linux-scale:
    name: Linux scale (${{ matrix.scenario }})
    needs: [build, public-suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: mixed-100k, index: ivf, rows: 100000, budget: 1280, workers: 4, mixed: true}
          - {scenario: ivf-400k, index: ivf, rows: 400000, budget: 1024, workers: 1}
          - {scenario: diskann-200k, index: diskann, rows: 200000, budget: 1024, workers: 4}
          # Same ~600 MiB vector working set across capacity boundary and concurrency.
          # Prepare under 1024 MiB; compare vector-only reads at all three budgets.
          # Scalar/vector result-copy coverage remains in the full lifecycle jobs.
          # 128 MiB is a positive read-only case, not an
          # underfunded writer reclassified after it fails.
          - {scenario: boundary-128-1, index: ivf, rows: 400000, budget: 128, workers: 1, boundary: true}
          - {scenario: boundary-512-4, index: ivf, rows: 400000, budget: 512, workers: 4, boundary: true}
          - {scenario: boundary-1024-8, index: ivf, rows: 400000, budget: 1024, workers: 8, boundary: true}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Install verified candidate
        run: |
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          cp candidate/commit.txt candidate/SHA256SUMS evidence/
          python -m pip install candidate/*.whl
      - name: Run bounded stress and lifecycle
        env:
          INDEX: ${{ matrix.index }}
          ROWS: ${{ matrix.rows }}
          BUDGET_MIB: ${{ matrix.budget }}
          WORKERS: ${{ matrix.workers }}
          MIXED: ${{ matrix.mixed }}
          BOUNDARY: ${{ matrix.boundary }}
        shell: bash
        run: |
          set -o pipefail
          args=()
          if [[ "$MIXED" == true ]]; then args+=(--mixed); fi
          if [[ "$BOUNDARY" == true ]]; then
            python -X faulthandler .github/scripts/buffer_pool_acceptance.py "$INDEX" \
              "$RUNNER_TEMP/collection" evidence/preparation.jsonl --rows "$ROWS" \
              --dimension 384 --budget-mib 1024 2>&1 | tee evidence/preparation.log
            args+=(--read-only --vector-only)
          fi
          python -X faulthandler .github/scripts/buffer_pool_acceptance.py "$INDEX" \
            "$RUNNER_TEMP/collection" evidence/rss.jsonl --rows "$ROWS" \
            --dimension 384 --budget-mib "$BUDGET_MIB" --workers "$WORKERS" "${args[@]}" \
            2>&1 | tee evidence/stress.log
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-${{ matrix.scenario }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  soak:
    name: One-hour mixed lifecycle (${{ matrix.index }})
    needs: [build, linux-scale]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        index: [ivf, diskann]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Run fixed-size corpus with writes, reads and reopen for an hour
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -o pipefail
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          python -m pip install candidate/*.whl
          seconds=$(python -c 'import json; print(json.load(open(".github/scripts/buffer_pool_policy.json"))["soak_seconds"])')
          python -X faulthandler .github/scripts/buffer_pool_acceptance.py "$INDEX" \
            "$RUNNER_TEMP/collection" evidence/rss.jsonl --workers 8 --soak-seconds "$seconds" \
            2>&1 | tee evidence/soak.log
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-soak-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  external-limit:
    name: cgroup hard memory limit and no swap (${{ matrix.index }})
    needs: [build, linux-scale]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        index: [ivf, diskann]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify candidate and run under system memory enforcement
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -o pipefail
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          python -m pip install candidate/*.whl
          python_path=$(command -v python)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="buffer-pool-${{ matrix.index }}-${{ github.run_id }}" \
            --property=MemoryMax=1536M --property=MemorySwapMax=0 \
            --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
            --setenv=OPENBLAS_NUM_THREADS=1 --setenv=OMP_NUM_THREADS=1 \
            "$python_path" .github/scripts/buffer_pool_system_limit.py 1610612736 evidence/cgroup.jsonl \
            "$python_path" -X faulthandler .github/scripts/buffer_pool_acceptance.py "$INDEX" \
            "$RUNNER_TEMP/collection" evidence/rss.jsonl --rows 100000 --workers 4 \
            2>&1 | tee evidence/external-limit.log
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-cgroup-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  production:
    name: Cohere 1M baseline and candidate (${{ matrix.index }}, ${{ matrix.storage }})
    needs: [build, build-memory, baseline-build, linux-scale, soak, external-limit, desktop, windows, android, ios, musllinux, io-backends]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        index: [ivf, diskann]
        storage: [buffer, mmap]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-baseline
          path: baseline
      - name: Verify provenance and isolate both packages
        run: |
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          cmp <(python -c 'import json; print(json.load(open(".github/scripts/buffer_pool_policy.json"))["baseline_commit"])') baseline/commit.txt
          for role in baseline candidate; do
            (cd "$role" && sha256sum -c SHA256SUMS)
            cp "$role/commit.txt" "evidence/$role-commit.txt"
            cp "$role/SHA256SUMS" "evidence/$role-SHA256SUMS"
            python -m venv "$RUNNER_TEMP/$role-venv"
            "$RUNNER_TEMP/$role-venv/bin/python" -m pip install "$role"/*.whl pyarrow
            "$RUNNER_TEMP/$role-venv/bin/python" -m pip freeze > "evidence/$role-packages.txt"
          done
          uname -a > evidence/environment.txt
          lscpu >> evidence/environment.txt
          lsblk >> evidence/environment.txt
          free -m >> evidence/environment.txt
          df -h >> evidence/environment.txt
      - name: Fetch versioned public Cohere 1M inputs
        run: |
          data_dir="$RUNNER_TEMP/cohere"
          mkdir -p "$data_dir"
          while read -r name size etag; do
            curl --fail --silent --show-error --location --retry 2 --max-time 1200 \
              --header "If-Match: \"$etag\"" --max-filesize "$size" \
              "https://assets.zilliz.com/benchmark/cohere_medium_1m/$name" --output "$data_dir/$name"
            test "$(stat -c %s "$data_dir/$name")" -eq "$size"
          done <<'DATASET'
          shuffle_train.parquet 3134418448 aa5dee664dc87b3e416c9863723a0ba4-374
          test.parquet 3133165 c63a0efd0e611d9f35345af1fc6f7966
          neighbors.parquet 3704127 d1aca052763a292b10e80bbda964f55d
          DATASET
          (cd "$data_dir" && sha256sum ./*.parquet) > evidence/dataset-sha256.txt
      - name: Compare both versions under identical external limits
        env:
          INDEX: ${{ matrix.index }}
          STORAGE: ${{ matrix.storage }}
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libaio1t64 liburing2
          # Build and remove one index at a time, on this same runner. This avoids
          # keeping two copies of the million-row index or benchmarking two CPUs.
          limit_mib=6144
          if [[ "$INDEX" == diskann ]]; then limit_mib=8192; fi
          for role in baseline candidate; do
            test "$(df --output=avail -k "$RUNNER_TEMP" | tail -1)" -gt 6291456
            python_path="$RUNNER_TEMP/$role-venv/bin/python"
            sudo systemd-run --quiet --wait --pipe --collect \
              --unit="cohere-$role-${{ github.run_id }}" \
              --property="MemoryMax=${limit_mib}M" --property=MemorySwapMax=0 \
              --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
              --setenv=OPENBLAS_NUM_THREADS=1 --setenv=OMP_NUM_THREADS=1 \
              "$python_path" .github/scripts/buffer_pool_system_limit.py \
              "$((limit_mib * 1024 * 1024))" "evidence/$role-cgroup.jsonl" \
              "$python_path" -X faulthandler .github/scripts/buffer_pool_cohere.py "$INDEX" "$STORAGE" \
              "$RUNNER_TEMP/cohere" "$RUNNER_TEMP/collection-$role" "evidence/$role.jsonl" --role "$role" \
              2>&1 | tee "evidence/$role.log"
            rm -rf -- "$RUNNER_TEMP/collection-$role"
          done
          python .github/scripts/buffer_pool_report.py performance evidence/baseline.jsonl \
            evidence/candidate.jsonl evidence/performance.json
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-cohere-${{ matrix.index }}-${{ matrix.storage }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Acceptance summary
    if: always()
    needs: [build, build-memory, acceptance, public-suite, baseline-build, desktop, windows, android, ios, musllinux, io-backends, linux-scale, soak, external-limit, production]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report stages and fixed support scope
        run: |
          printf '%s\n' "$RESULTS" > needs.json
          printf '## Buffer Pool acceptance\n\nCandidate: %s\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "- **\(.key)** — \(.value.result)"' needs.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.scope | to_entries[] | "- **\(.key)**: \(.value)"' .github/scripts/buffer_pool_policy.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: buffer-pool-*
          path: evidence
      - name: Require all stages and mandatory evidence
        run: |
          set -o pipefail
          check_rc=0
          python .github/scripts/buffer_pool_report.py summary evidence needs.json acceptance.json \
            | tee evidence-check.log || check_rc=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path("acceptance.json").read_text())
          print("\n**Verdict: " + ("PASS" if result["passed"] else "FAIL") + "**\n")
          if not result["passed"]:
              print(result["reason"])
          else:
              print(f"Verified {len(result['verified'])} mandatory evidence groups. QPS >= 80%; P99 <= 125% of the pinned baseline.\n")
              print("| Index build | Input MiB | Budget MiB | Build peak RSS MiB | Seconds | Workers |")
              print("|---|---:|---:|---:|---:|---:|")
              for build in result["builds"]:
                  print(f"| {build['index']} | {build['input_vector_bytes'] / 1024**2:.1f} | {build['budget_mib']} | {build['build_peak_rss_kib'] / 1024:.1f} | {build['build_seconds']:.1f} | {build['build_workers']} |")
              print()
              print("| Index | Storage | Distribution | Cache | QPS / baseline | P99 / baseline |")
              print("|---|---|---|---|---:|---:|")
              for benchmark in result["benchmarks"]:
                  for case in benchmark["cases"]:
                      print(f"| {benchmark['index']} | {benchmark['storage']} | {case['distribution']} | {case['cache']} | {case['qps_ratio']:.3f} | {case['p99_ratio']:.3f} |")
              for item in result["unsupported"]:
                  print(f"\nUnsupported native observation: {item['suite']}/{item['test']} — {item['reason']}")
          PY
          exit "$check_rc"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-acceptance-report
          path: |
            acceptance.json
            needs.json
            .github/scripts/buffer_pool_policy.json
          if-no-files-found: error
          retention-days: 14
