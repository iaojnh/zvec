name: Buffer Pool PQ construction diagnostic

on:
  push:
    branches: [test/buffer-pool-pq-build-20261108]

permissions:
  contents: read

concurrency:
  group: buffer-pool-pq-construction-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  build:
    name: Build Linux x64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: buffer-pool-acceptance-linux-x64
          max-size: 1G
      - name: Build wheel and native test executables
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(python - <<'PY'
          import os
          from pathlib import Path
          memory = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
          available_kib = int(memory["MemAvailable"].split()[0])
          print(max(1, min(4, os.cpu_count() or 1, available_kib // (2 * 1024**2))))
          PY
          )
          python -m pip install pybind11==3.0 cmake==3.30.0 ninja==1.11.1 \
            scikit-build-core setuptools_scm
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir candidate \
            -C cmake.define.AUTO_DETECT_ARCH=OFF \
            -C cmake.define.BUILD_C_BINDINGS=ON \
            -C cmake.define.BUILD_ZVEC_SHARED=OFF \
            -C cmake.define.BUILD_ZVEC_AILEGO_SHARED=OFF \
            -C cmake.define.BUILD_ZVEC_CORE_SHARED=OFF \
            -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
          read -r -a targets <<< "$(python .github/scripts/buffer_pool_backend_tests.py --print-targets)"
          # These targets are bundled and executed below. Desktop compatibility
          # jobs separately compile the full native test suite.
          cmake --build build --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" --target "${targets[@]}"
          python .github/scripts/buffer_pool_native_bundle.py build candidate/native-tests.tar.gz "${targets[@]}"
          git rev-parse HEAD > candidate/commit.txt
          git submodule status --recursive > candidate/submodules.txt
          printf '%s\n' "$CMAKE_BUILD_PARALLEL_LEVEL" > candidate/compiler-parallelism.txt
          grep -E '^(AUTO_DETECT_ARCH|BUILD_.*SHARED|CMAKE_(BUILD_TYPE|CXX_COMPILER|CXX_FLAGS|GENERATOR)):' build/CMakeCache.txt > candidate/build-config.txt
          (cd candidate && sha256sum ./*.whl ./native-tests.tar.gz > SHA256SUMS)
      - name: Verify portable distance kernels
        run: |
          python -m pip install candidate/*.whl
          python .github/scripts/buffer_pool_distance_sanity.py
      - name: Verify shutdown persistence without reopening readers
        run: |
          cmake --build build --parallel 2 --target segment_test
          ./build/bin/segment_test --gtest_color=no \
            --gtest_filter='*FlushForClosePersistsVectorsAndForwardRows*' \
            --gtest_output=xml:candidate/close-persistence.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tests = list(ET.parse("candidate/close-persistence.xml").iter("testcase"))
          assert tests and any(t.find("skipped") is None for t in tests)
          assert not any(t.find("failure") is not None or t.find("error") is not None for t in tests)
          PY
          (cd candidate && sha256sum close-persistence.xml >> SHA256SUMS)
      - uses: ./.github/actions/upload-evidence
        with:
          name: buffer-pool-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 14

  build-memory:
    name: Index build memory control (${{ matrix.index }}, 512 MiB)
    needs: build
    runs-on: ubuntu-24.04
    # The 400K x 768 DiskANN graph also runs on ordinary shared CI CPUs.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: ivf, native_filter: '*/Ivf*'}
          - {index: diskann, native_filter: '*/Diskann*'}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify build admission and retry after rejection
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/candidate/lib
          NATIVE_FILTER: ${{ matrix.native_filter }}
        run: |
          mkdir -p evidence
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          python -m pip install candidate/*.whl
          tar -xzf candidate/native-tests.tar.gz -C candidate
          candidate/bin/index_build_admission_test --gtest_color=no \
            --gtest_filter="$NATIVE_FILTER" --gtest_output=xml:evidence/native.xml
      - name: Build a larger-than-budget corpus without swap
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -o pipefail
          python_path=$(command -v python)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="index-build-${{ matrix.index }}-${{ github.run_id }}" \
            --property=MemoryMax=768M --property=MemorySwapMax=0 \
            --property=LimitNOFILE=65536 \
            --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
            --setenv=OPENBLAS_NUM_THREADS=1 --setenv=OMP_NUM_THREADS=1 \
            "$python_path" .github/scripts/buffer_pool_system_limit.py 805306368 evidence/cgroup.jsonl \
            "$python_path" -X faulthandler .github/scripts/buffer_pool_build_memory.py \
            "$INDEX" "$RUNNER_TEMP/build-memory-collection" evidence/build.jsonl \
            2>&1 | tee evidence/build.log
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: buffer-pool-evidence-build-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  io-backends:
    name: Linux x64 shared paths (${{ matrix.backend }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [io_uring, libaio, pread]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v8
        with:
          name: buffer-pool-candidate
          path: candidate
      - name: Verify and install the exact candidate
        run: |
          cmp <(git rev-parse HEAD) candidate/commit.txt
          (cd candidate && sha256sum -c SHA256SUMS)
          tar -xzf candidate/native-tests.tar.gz -C candidate
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/candidate/lib" >> "$GITHUB_ENV"
          python -m pip install candidate/*.whl pytest pytest-xdist
      - uses: ./.github/actions/buffer-pool-backend
        with:
          backend: ${{ matrix.backend }}
          platform: linux-x64
          native-bin: ${{ github.workspace }}/candidate/bin

