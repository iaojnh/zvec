name: Buffer Pool desktop lifecycle
description: Exercise IVF and DiskANN in separate processes using the installed candidate

inputs:
  platform:
    description: Unique build matrix platform label
    required: true

runs:
  using: composite
  steps:
    - name: Install process memory reader
      if: runner.os != 'Linux'
      shell: bash
      run: python -m pip install psutil
    - name: Run IVF and DiskANN lifecycle
      shell: bash
      run: |
        set -o pipefail
        mkdir -p buffer-pool-evidence
        git rev-parse HEAD > buffer-pool-evidence/commit.txt
        status=0
        for index in ivf diskann; do
          python -X faulthandler .github/scripts/buffer_pool_acceptance.py "$index" \
            "$RUNNER_TEMP/buffer-pool-$index" "buffer-pool-evidence/$index-rss.jsonl" \
            2>&1 | tee "buffer-pool-evidence/$index.log" || status=1
        done
        exit "$status"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: buffer-pool-desktop-${{ inputs.platform }}
        path: buffer-pool-evidence/
        retention-days: 14
